<div class="gallery">
  <div class="gallery-details">
    <img src="./assets/img/icone-logo.png" alt="Ícone logo Vaninho Náutica">
    <p>SERVIÇOS FEITOS</p>
  </div>
  <h1 class="gallery-title">Antes e depois</h1>
  <div class="gallery-img-container">
    <button class="previus" id="previusBtn" type="button" aria-label="Imagem anterior">
      <i class="fa-solid fa-angle-left"></i>
    </button>

    <div class="gallery-viewport">
      <div class="gallery-images-container" id="gallery-images-container"></div>
    </div>
    
    <button class="next" id="nextBtn" type="button" aria-label="Próxima imagem">
      <i class="fa-solid fa-angle-right"></i>
    </button>
  </div>

  <div class="dots"></div>
  <button class="gallery-btn">
    <i class="fa-regular fa-image"></i>
    <p>
      Ver mais serviços
    </p>
  </button>

  <div class="gallery-lightbox" id="galleryLightbox">
    <img id="galleryLightboxImg" src="" alt="Serviço realizado ampliado">
  </div>
</div>
